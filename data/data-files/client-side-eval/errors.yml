---
name: errors - <TYPE_NAME>
specifications:
  - spec: "FLGEA"
    number: "1.6.1"
    summary: "flag not found returns ERROR with errorKind FLAG_NOT_FOUND"
  - spec: "FLGEDETAIL"
    number: "1.2.2"
    summary: "reason kind ERROR when flag could not be evaluated"
  - spec: "FLGEDETAIL"
    number: "1.3.1"
    summary: "errorKind FLAG_NOT_FOUND when flag key unknown"
  - spec: "FLGEDETAIL"
    number: "1.1.2"
    summary: "default value returned when evaluation fails"

skipEvaluateAllFlags: true

parameters:
  - TYPE_NAME: bool
    TYPE_DEFAULT: false

  - TYPE_NAME: int
    TYPE_DEFAULT: -1

  - TYPE_NAME: double
    TYPE_DEFAULT: 0.5

  - TYPE_NAME: string
    TYPE_DEFAULT: "x"

  - TYPE_NAME: any
    TYPE_DEFAULT: false

sdkData: {}

context:
  kind: user
  key: user-key

evaluations:
  - name: flag not found
    flagKey: unknown-flag
    valueType: <TYPE_NAME>
    default: <TYPE_DEFAULT>
    expect:
      value: <TYPE_DEFAULT>
      reason: { kind: "ERROR", errorKind: "FLAG_NOT_FOUND" }
