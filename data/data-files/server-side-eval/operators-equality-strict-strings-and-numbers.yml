---
name: operators - equality does not coerce strings and numbers

# The "in" operator requires both values to have the same JSON type, and compares strings as exact
# case-sensitive character sequences. A string that looks like a number is still a string: it never
# equals a number, and it never equals a different string that happens to denote the same number.
# Loosely-typed languages make this easy to get wrong, for instance with an equality operator that
# converts numeric strings to numbers before comparing them.

constants:
  IS_MATCH:
    value: true
    variationIndex: 0
    reason: { kind: "RULE_MATCH", ruleIndex: 0, ruleId: "ruleid" }
  IS_NOT_MATCH:
    value: false
    variationIndex: 1
    reason: { kind: "FALLTHROUGH" }

parameters:
  # strings never equal numbers
  - NAME: string 1 does not match number 1
    CONTEXT: { key: "user-key", custom: { attrname: "1" } }
    CLAUSE_VALUES: [ 1 ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: number 1 does not match string 1
    CONTEXT: { key: "user-key", custom: { attrname: 1 } }
    CLAUSE_VALUES: [ "1" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 1.5 does not match number 1.5
    CONTEXT: { key: "user-key", custom: { attrname: "1.5" } }
    CLAUSE_VALUES: [ 1.5 ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: number 0 does not match empty string
    CONTEXT: { key: "user-key", custom: { attrname: 0 } }
    CLAUSE_VALUES: [ "" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: empty string does not match number 0
    CONTEXT: { key: "user-key", custom: { attrname: "" } }
    CLAUSE_VALUES: [ 0 ]
    EXPECT: <IS_NOT_MATCH>

  # strings never equal booleans
  - NAME: string 0 does not match boolean false
    CONTEXT: { key: "user-key", custom: { attrname: "0" } }
    CLAUSE_VALUES: [ false ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: empty string does not match boolean false
    CONTEXT: { key: "user-key", custom: { attrname: "" } }
    CLAUSE_VALUES: [ false ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: boolean false does not match empty string
    CONTEXT: { key: "user-key", custom: { attrname: false } }
    CLAUSE_VALUES: [ "" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string true does not match boolean true
    CONTEXT: { key: "user-key", custom: { attrname: "true" } }
    CLAUSE_VALUES: [ true ]
    EXPECT: <IS_NOT_MATCH>

  # numeric-looking strings are compared as strings, not as numbers
  - NAME: string 1.0 does not match string 1
    CONTEXT: { key: "user-key", custom: { attrname: "1.0" } }
    CLAUSE_VALUES: [ "1" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 1 does not match string 1.0
    CONTEXT: { key: "user-key", custom: { attrname: "1" } }
    CLAUSE_VALUES: [ "1.0" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 007 does not match string 7
    CONTEXT: { key: "user-key", custom: { attrname: "007" } }
    CLAUSE_VALUES: [ "7" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 1e3 does not match string 1000
    CONTEXT: { key: "user-key", custom: { attrname: "1e3" } }
    CLAUSE_VALUES: [ "1000" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 1000 does not match string 1e3
    CONTEXT: { key: "user-key", custom: { attrname: "1000" } }
    CLAUSE_VALUES: [ "1e3" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string with leading space does not match string without it
    CONTEXT: { key: "user-key", custom: { attrname: " 1" } }
    CLAUSE_VALUES: [ "1" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string with trailing space does not match string without it
    CONTEXT: { key: "user-key", custom: { attrname: "1 " } }
    CLAUSE_VALUES: [ "1" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string +1 does not match string 1
    CONTEXT: { key: "user-key", custom: { attrname: "+1" } }
    CLAUSE_VALUES: [ "1" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 0x1A does not match string 26
    CONTEXT: { key: "user-key", custom: { attrname: "0x1A" } }
    CLAUSE_VALUES: [ "26" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string abc does not match string ABC
    CONTEXT: { key: "user-key", custom: { attrname: "abc" } }
    CLAUSE_VALUES: [ "ABC" ]
    EXPECT: <IS_NOT_MATCH>

  - NAME: string 007 does not match any numerically equal value in a list
    CONTEXT: { key: "user-key", custom: { attrname: "007" } }
    CLAUSE_VALUES: [ "7", "07", "7.0", 7 ]
    EXPECT: <IS_NOT_MATCH>

  # identical values still match
  - NAME: string 007 matches string 007
    CONTEXT: { key: "user-key", custom: { attrname: "007" } }
    CLAUSE_VALUES: [ "007" ]
    EXPECT: <IS_MATCH>

  - NAME: string 1e3 matches string 1e3 in a list
    CONTEXT: { key: "user-key", custom: { attrname: "1e3" } }
    CLAUSE_VALUES: [ "1000", "1e3" ]
    EXPECT: <IS_MATCH>

  - NAME: number 1000 matches number 1000
    CONTEXT: { key: "user-key", custom: { attrname: 1000 } }
    CLAUSE_VALUES: [ 1000 ]
    EXPECT: <IS_MATCH>

  - NAME: array attribute with a numeric string does not match the number
    CONTEXT: { key: "user-key", custom: { attrname: [ "7" ] } }
    CLAUSE_VALUES: [ 7 ]
    EXPECT: <IS_NOT_MATCH>

sdkData:
  flags:
    test-flag:
      on: true
      fallthrough: { variation: 1 }
      variations: [ true, false ]
      rules:
        - id: ruleid
          variation: 0
          clauses:
            - { attribute: attrname, op: in, values: <CLAUSE_VALUES> }

evaluations:
  - name: <NAME>
    flagKey: test-flag
    context: <CONTEXT>
    default: false
    expect: <EXPECT>
