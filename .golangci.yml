version: "2"
run:
  timeout: 120s
  tests: false
linters:
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gocyclo
    - godox
    - gosec
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^require\.Never$
          msg: "use h.RequireNever instead — require.Never spawns goroutines that cause race conditions"
  exclusions:
    presets: []
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 1000
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: false
    goimports:
      local-prefixes:
        - gopkg.in/launchdarkly
        - github.com/launchdarkly
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
