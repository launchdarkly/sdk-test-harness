version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'github.com/launchdarkly/*'

  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    target-branch: 'v3'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'gomod'
    directory: '/'
    target-branch: 'v3'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'github.com/launchdarkly/*'
